<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="The Impostor Game - a pass-and-play social deduction party game for 4-12 players on one device.">
  <meta name="theme-color" content="#EFEFEF">
  <title>The Impostor Game</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <header>
      <h1 class="wordmark">Impostor<br>Game</h1>
      <button class="close" id="quit" aria-label="Quit game">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
    </header>
    <div id="app" style="display:contents" aria-live="polite">
      <p>Loading words&hellip;</p>
    </div>
    <noscript>
      <p>This game needs JavaScript to run. Please enable JavaScript and reload.</p>
    </noscript>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
